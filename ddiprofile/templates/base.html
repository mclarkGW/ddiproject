<!doctype html>
<html lang="en">
{% load static %}

<head>
  <!-- Global site tag (gtag.js) - Google Analytics -->

  <!-- Mike's Pages have to add this in-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />

    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-0GE4FDX81Z');
  </script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
  <meta name="generator" content="Jekyll v4.1.1">

  <link rel="canonical" href="https://getbootstrap.com/docs/4.5/examples/dashboard/">
  <link rel="icon" 
        type="image/png" 
        href="https://www.flaticon.com/svg/static/icons/svg/56/56916.svg">

  <script src="{% static 'scripts/jquery.min.js' %}"></script>
  <script src="{% static 'scripts/popper.min.js' %}"></script>
  <script src="{% static 'scripts/bootstrap.min.js' %}"></script>
  <script src="{% static 'scripts/modernizr.js' %}"></script>
  <script src="{% static 'scripts/hierarchy-select.min.js' %}"></script>

  <!-- Bootstrap core CSS (legacy for 4.x support, safe to keep) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"

  <link rel="stylesheet" href="{% static 'css/hierarchy-select.min.css' %}">
</head>

<body>
  <style>
    .no-js #loader { display: none; }
    .js #loader { display: block; position: absolute; left: 100px; top: 0; }
    .se-pre-con {
      position: fixed; left: 0px; top: 0px; width: 100%; height: 100%;
      z-index: 9999; background: url({% static  'images/Preloader_7.gif' %}) center no-repeat #fff;
    }
  </style>
  <div class="se-pre-con"></div>
  <script>
    $(window).on("load", function () {
      $(".se-pre-con").fadeOut("slow");
    });
  </script>

  <nav class="navbar sticky-top navbar-expand-lg navbar-light bg-light shadow p-1 mb-1 bg-white rounded">
    <a class="navbar-brand">
      <span class="badge badge-danger">
        <i class="bi bi-arrow-up-right-square-fill"></i>
      </span>
      <span style="font-weight: bold;"> Informative Workspace</span>
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" href="http://10.143.58.80:8010/feature/executive/health">
            <span class="badge badge-info">
              <i class="bi bi-app-indicator"></i>
            </span>
            <b>Health Metrics</b>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://10.143.58.80:8010/dashboard/">
            <span class="badge badge-primary">
              <i class="bi bi-graph-up"></i>
            </span>
            <b>Release </b>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://10.143.58.80:8010/dashboard/sprint">
            <span class="badge badge-warning">
              <i class="bi bi-clock-history"></i>
            </span>
            <b>Sprint </b>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://10.143.58.80:8010/dashboard/deal">
            <span class="badge badge-dark">
              <i class="bi bi-infinity"></i>
            </span>
            <b>Deal</b>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://10.143.58.80:8010/metrics">
            <span class="badge badge-success">
              <i class="bi bi-sort-up"></i>
            </span>
            <b>Analytics</b>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://10.143.58.80:8010/admin" target="_blank">
            <span class="badge badge-danger">
              <i class="bi bi-lock"></i>
            </span>
            <b>Admin</b>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://10.143.58.80:8010/metrics/planning/poc">
            <span class="badge badge-secondary">
              <i class="bi bi-journals"></i>
            </span>
            <b>Utility</b>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://10.143.58.80:8010/metrics/initiative/">
            <span class="badge badge-secondary">
              <i class="bi bi-columns-gap"></i>
            </span>
            <b>Initiatives</b>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'dashboard' %}">
            <span class="badge badge-info">
              <i class="bi bi-clipboard2-pulse"></i>
            </span>
            <b>DDI</b>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'crdashboard' %}">
            <span class="badge badge-secondary">
              <i class="bi bi-clipboard-data"></i>
            </span>
            <b>CR</b>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'gapdashboard' %}">
            <span class="badge badge-secondary">
              <i class="bi bi-clipboard-data"></i>
            </span>
            <b>GAP</b>
          </a>
        </li>
      </ul>
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" href="" onclick="window.print()">
            <span class="badge badge-light">
              <i class="bi bi-printer" style="color: black;"></i>
            </span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://10.143.58.80:8010/metrics/about">
            <span class="badge badge-warning" data-toggle='tooltip' data-placement='bottom' title='How it works ?'>
              <i class="bi bi-info-square" style="color: black;"></i>
            </span>
          </a>
        </li>
      </ul>

  <div class="container-fluid" style="width:100%">
    <main role="main">
      <div style="height: 5px;"></div>
      {% block content %}
      {% endblock %}
    </main>
    <br>
  </div>

  <script>
    $(document).ready(function () {
      $('[data-toggle="popover"]').popover();
      $('[data-toggle="tooltip"]').tooltip();
    });
  </script>
  <br>
</body>
</html>
