<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Dashboard Management{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-datepicker@1.9.0/dist/css/bootstrap-datepicker.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-datepicker@1.9.0/dist/js/bootstrap-datepicker.min.js"></script>
    <style>
        /* Custom navbar shadow (optional, for more depth) */
        .navbar-custom-shadow {
            box-shadow: 0 4px 12px -1px rgba(0,0,0,0.10), 0 1.5px 5px -1px rgba(0,0,0,0.06);
        }
        /* Make sure page content clears the fixed navbar */
        .page-title-space {
            margin-top: 70px; /* Adjust if your navbar height changes */
        }
        /* Optional: Enhance navbar font weight */
        .navbar-light .navbar-nav .nav-link {
            color: #212529 !important;
            font-weight: 500;
        }
        /* Optional: Bold brand */
        .navbar-light .navbar-brand {
            font-weight: bold;
            color: #00EEAE !important; /* Bootstrap info color */
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar fixed-top navbar-expand-lg navbar-light bg-light shadow navbar-custom-shadow">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'home' %}">Dashboard Managment</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">DDI Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'crdashboard' %}">CR Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Title (with space below navbar) -->
    <div class="container-fluid page-title-space">
        <h1 class="display-5 my-3">{% block page_title %}{% endblock %}</h1>
    </div>

    <!-- Main Content -->
    <main class="container-fluid py-4">
        <style>
            .container {
                max-width: 100% !important;
            }
        </style>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Section -->
    <footer class="bg-light text-muted text-center small py-2 border-top shadow-sm">
        <div>
            <span>
                <a href="mailto:michael.j.clark@gainwelltechnologies.com" class="text-info text-decoration-none">Development Support</a>
            </span>
            <span class="mx-2">|</span>
            <span>Engineering - Gainwell Technologies</span>
        </div>
        <div class="pt-1">
            <a href="{% url 'iteration' %}" class="text-info text-decoration-none">Iterations</a>
            <span class="mx-2">|</span>
            <a href="{% url 'run_fetch_iterations' %}" class="text-info text-decoration-none">Fetch Iterations</a>
            <span class="mx-2">|</span>
            <a href="{% url 'run_fetch_data' %}" class="text-info text-decoration-none">Fetch Data</a>
            <span class="mx-2">|</span>
            <a href="{% url 'admin:index' %}" class="text-info text-decoration-none">Admin</a>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
