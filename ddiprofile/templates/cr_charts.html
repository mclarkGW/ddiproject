{% extends 'base.html' %}
{% block title %}CR Charts{% endblock %}

{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR Charts</title>
<style>
    .cr-dash-header {
        text-align: center;
        font-size: 3rem;
        font-weight: 800;
        color: #29343b;
        margin-top: 2.5rem;
        margin-bottom: 1.2rem;
        letter-spacing: 1.5px;
        border-bottom: 4px solid #1dc7b2;
        display: inline-block;
        padding-bottom: 0.4rem;
        box-shadow: 0 6px 12px -10px #1dc7b2;
    }
    .cr-dash-chart-title {
        text-align: center;
        font-size: 1.15rem;
        font-weight: 600;
        color: #10898b;
        margin-bottom: 0.7rem;
        margin-top: 0;
        letter-spacing: 0.5px;
        border-bottom: 2.5px solid #b7e4c7;
        display: inline-block;
        padding-bottom: 0.2rem;
        box-shadow: 0 2px 6px -5px #b7e4c7;
        width: 100%;
        background: #eafaf4;
        border-radius: 6px 6px 0 0;
    }
    .cr-dash-toolbar {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
        margin-left: 0.5rem;
    }
    .cr-dash-btn {
        padding: 10px 22px;
        font-size: 1.1em;
        background: #17a2b8;
        color: white;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 2px 8px 0 rgba(23,162,184,0.11);
        transition: background 0.15s;
        text-decoration: none;
    }
    .cr-dash-btn:hover {
        background: #138496;
        color: #fff;
    }
    .cr-dash-filter-dropdown:focus {
        border-color: #138496;
        outline: none;
    }
</style>
</head>
    <!-- CR Charts button and heading row -->
<ul class="nav nav-tabs d-print-none mb-3">
    <li class="nav-item">
        <a class="nav-link {% if active_tab == 'dashboard' %}active{% endif %}" href="{% url 'crdashboard' %}">
            <b>CR Dashboard</b>
            <span class="badge bg-warning"style="color: black">
                <i class="bi bi-clipboard-data"></i>
            </span>
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if active_tab == 'charts' %}active{% endif %}" href="{% url 'crcharts' %}">
            <span class="badge bg-primary">
                <i class="bi bi-bar-chart"></i>
            </span>
            <span style="color: #007bff; font-weight: 250;">CR Charts</span>
        </a>
    </li>
</ul>
<div class="text-center">
    <h4>Change Request Charts</h4>
</div>
<br>
<br>
<div style="display: flex; gap: 30px;">
    <div style="flex: 1;">
        <span class="badge bg-primary fs-5 fw-bold mb-2" style="width:100%;display:inline-block;">CRs by Release</span>
        <canvas id="crsByReleaseChart" width="500" height="300"></canvas>
    </div>
    <div style="flex: 1;">
        <span class="badge bg-success fs-5 fw-bold mb-2" style="width:100%;display:inline-block;">CRs by Account</span>
        <canvas id="crsByAccountChart" width="500" height="300"></canvas>
    </div>
    <div style="flex: 1;">
        <span class="badge bg-danger fs-5 fw-bold mb-2" style="width:100%;display:inline-block;">CRs by Status</span>
        <canvas id="crsByStatusChart" width="500" height="300"></canvas>
    </div>
</div>
<br>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
function makeBarChart(canvasId, labels, data, color) {
    var ctx = document.getElementById(canvasId).getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: '',
                data: data,
                backgroundColor: color,
                borderColor: color,
                borderWidth: 1
            }]
        },
        options: {
            plugins: { legend: { display: false }},
            scales: { y: { beginAtZero: true } }
        }
    });
}
//bg-info: #17a2b8 (or in v5, #0dcaf0)
//bg-danger: #dc3545
//bg-secondary:#6c757d
//bg-success: #198754
//bg-warning: #ffc107
//bg-primary: #0d6efd-->
makeBarChart(
    'crsByReleaseChart',
    {{ release_labels|safe }},
    {{ release_data|safe }},
    '#ffc107'
);
makeBarChart(
    'crsByAccountChart',
    {{ account_labels|safe }},
    {{ account_data|safe }},
    '#6c757d'
);
makeBarChart(
    'crsByStatusChart',
    {{ status_labels|safe }},
    {{ status_data|safe }},
    '#ffc107'
);
</script>
{% endblock %}
